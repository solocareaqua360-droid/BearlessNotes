<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Звички: Кільця</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#2a2a2e;font-family:"Sora",system-ui,sans-serif;padding:24px;color:#fff}
.row{display:flex;gap:26px}figure{margin:0;width:475px}figcaption{font-size:13.5px;color:#aaa;margin-top:10px;line-height:1.4}figcaption b{display:block;color:#fff;font-size:15px}
.ph{position:relative;width:475px;height:751px;border-radius:38px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#1d2230 0%,#0b0c10 62%)}
.st{padding:16px 28px 0;font-size:12px;opacity:.8;display:flex;justify-content:space-between}
.hd{padding:10px 28px 0;display:flex;justify-content:space-between;align-items:flex-end}
.hd small{letter-spacing:.18em;font-size:11px;color:#8f96aa;text-transform:uppercase}
.hd h2{margin:2px 0 0;font-size:28px;font-weight:700}
.hero{position:relative;width:230px;height:230px;margin:8px auto 0}
.hero svg{position:absolute;inset:0}
.hero .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hero .c b{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;display:block}.hero .c span{font-size:10px;color:#8f96aa;letter-spacing:.12em;text-transform:uppercase;display:block;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 22px 0}
.t{background:#15171e;border-radius:24px;padding:9px 6px 8px;text-align:center}
.t svg{display:block;margin:0 auto 6px}.t b{font-size:12.5px;display:block}.t span{font-size:11px;color:#8f96aa}
.arc{position:absolute;left:50%;bottom:-205px;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:#171a23;box-shadow:0 -6px 40px rgba(0,0,0,.6)}
.arc i{position:absolute;font-style:normal;font-size:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#8f96aa}
.arc i.on{color:#fff;background:#252a38}
.sheet{position:absolute;left:0;right:0;bottom:0;height:560px;background:#14161d;border-radius:36px 36px 0 0;padding:14px 22px;box-shadow:0 -10px 50px rgba(0,0,0,.7)}
.grab{width:44px;height:5px;border-radius:3px;background:#3a3f50;margin:0 auto 14px}
.big{position:relative;width:200px;height:200px;margin:2px auto 8px}.big svg{position:absolute;inset:0}.big .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.big b{font-size:38px}.big span{font-size:12px;color:#8f96aa}
.r3{display:flex;gap:12px;justify-content:center;margin:4px 0 16px}.rb{width:84px;height:84px;border-radius:50%;background:#1f2330;display:grid;place-items:center;font-weight:700;font-size:17px}.rb.p{background:#5fd0ff;color:#06131a}
.bars{display:flex;gap:9px;align-items:flex-end;height:64px;padding:0 6px}.bars i{flex:1;border-radius:8px;background:#232838}.bars i.a{background:#5fd0ff}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8f96aa;margin:6px 6px 8px}
</style></head><body><div class="row">
<figure><div class="ph"><div class="st"><span>9:41</span><span>94%</span></div>
<div class="hd"><div><small>пʼятниця · 20 листопада</small><h2>Сьогодні</h2></div></div>
<div class="hero"><svg viewBox="0 0 250 250" width="230" height="230"><g fill="none" stroke-linecap="round" stroke-width="16"><circle cx="125" cy="125" r="108" stroke="#1d2130"/><circle cx="125" cy="125" r="108" stroke="#5fd0ff" stroke-dasharray="679" stroke-dashoffset="258" transform="rotate(-90 125 125)"/><circle cx="125" cy="125" r="84" stroke="#1d2130"/><circle cx="125" cy="125" r="84" stroke="#b6f06a" stroke-dasharray="528" stroke-dashoffset="150" transform="rotate(-90 125 125)"/><circle cx="125" cy="125" r="60" stroke="#1d2130"/><circle cx="125" cy="125" r="60" stroke="#ff8a6b" stroke-dasharray="377" stroke-dashoffset="160" transform="rotate(-90 125 125)"/></g></svg><div class="c"><div style="width:90px"><b>3<small style="font-size:18px;color:#8f96aa">/6</small></b><span>звичок</span></div></div></div>
<div class="grid">
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="#5fd0ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="55" transform="rotate(-90 27 27)"/><text x="27" y="33" text-anchor="middle" font-size="18">💧</text></svg><b>Вода</b><span>1,25 з 2 л</span></div>
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="#b6f06a" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="0" transform="rotate(-90 27 27)"/><text x="27" y="33" text-anchor="middle" font-size="18">💊</text></svg><b>Вітаміни</b><span>готово</span></div>
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="#ff8a6b" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="58" transform="rotate(-90 27 27)"/><text x="27" y="33" text-anchor="middle" font-size="18">📖</text></svg><b>Читання</b><span>18 з 30 хв</span></div>
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="#e7c85f" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="97" transform="rotate(-90 27 27)"/><text x="27" y="33" text-anchor="middle" font-size="18">🏋️</text></svg><b>Підтягування</b><span>1 з 3 підходів</span></div>
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><text x="27" y="33" text-anchor="middle" font-size="18">🌙</text></svg><b>Вечір</b><span>увечері</span></div>
<div class="t"><svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="#1d2130" stroke-width="5"/><circle cx="27" cy="27" r="23" fill="none" stroke="#c08cff" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="70" transform="rotate(-90 27 27)"/><text x="27" y="33" text-anchor="middle" font-size="18">🚶</text></svg><b>Ходьба</b><span>5 200 кроків</span></div>
</div>
<div class="arc"></div><div style="position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:34px"><div class="arc" style="display:none"></div><span style="font-size:22px;opacity:.5">◔</span><span style="width:58px;height:58px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:26px;margin-top:-14px;box-shadow:0 6px 26px rgba(95,208,255,.4)">+</span><span style="font-size:22px;opacity:.5">▤</span></div>
</div><figcaption><b>Кільця · Сьогодні</b>Одна велика діаграма з кілець замість списку кнопок. Нижче сітка круглих карток без жодної кнопки: торкнувся картки, відкрилась її сторінка. Док це півколо знизу з великою «+» посередині.</figcaption></figure>

<figure><div class="ph"><div class="st"><span>9:41</span><span>94%</span></div><div style="opacity:.25;padding:30px 28px"><div class="hero" style="transform:scale(.7);margin-top:0"></div></div>
<div class="sheet"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center;margin:0 6px"><b style="font-size:20px">💧 Вода</b><span style="color:#8f96aa;font-size:13px">ціль 2 л</span></div>
<div class="big"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="#1d2130" stroke-width="16"/><circle cx="100" cy="100" r="86" fill="none" stroke="#5fd0ff" stroke-width="16" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="205" transform="rotate(-90 100 100)"/></svg><div class="c"><div><b>1,25 л</b><br><span>ще 0,75 л</span></div></div></div>
<div class="r3"><div class="rb">+0,25</div><div class="rb p">+0,5</div><div class="rb" style="font-size:22px">↶</div></div>
<div class="lab">Тиждень</div><div class="bars"><i class="a" style="height:80%"></i><i class="a" style="height:100%"></i><i style="height:55%"></i><i class="a" style="height:90%"></i><i class="a" style="height:62%"></i><i style="height:0"></i><i style="height:0"></i></div>
<div class="lab" style="margin-top:14px">Листопад · 27 з 30 днів</div></div>
</div><figcaption><b>Кільця · Картка звички</b>Дії живуть лише тут, великими круглими кнопками, а не на головному екрані. Нижче тиждень і підсумок місяця.</figcaption></figure>
</div></body></html>
