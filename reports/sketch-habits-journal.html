<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Звички: Журнал</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Caveat:wght@600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#cfc7b8;font-family:"Fraunces",Georgia,serif;padding:24px;color:#2b2a45}
.row{display:flex;gap:26px}figure{margin:0;width:475px}figcaption{font-size:13.5px;color:#5c5748;margin-top:10px;line-height:1.4;font-family:system-ui}figcaption b{display:block;color:#2b2a45;font-size:15px}
.ph{position:relative;width:475px;height:751px;border-radius:30px;overflow:hidden;background:#f6efe0;background-image:repeating-linear-gradient(#f6efe0 0 31px,#e9dfca 31px 32px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.st{padding:16px 26px 0;font:12px system-ui;display:flex;justify-content:space-between}
.hd{padding:14px 26px 0;display:flex;justify-content:space-between;align-items:flex-end}
.hd h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}.hd span{font-family:"Caveat",cursive;font-size:26px;color:#c0463a;transform:rotate(-4deg)}
.cards{padding:16px 22px 0;display:flex;flex-direction:column;gap:12px}
.tk{display:flex;gap:14px;background:#fffdf7;border-radius:6px;padding:10px;box-shadow:0 2px 0 #d9cfb8,0 8px 18px rgba(80,60,20,.12);position:relative}
.tk::after{content:"";position:absolute;right:62px;top:6px;bottom:6px;border-right:2px dashed #d9cfb8}
.th{width:76px;height:76px;border-radius:4px;display:grid;place-items:center;font-size:34px;flex:none}
.tx{flex:1;display:flex;flex-direction:column;justify-content:center}.tx b{font-size:19px}.tx span{font:13px system-ui;color:#6b6552;margin-top:3px}
.mk{width:50px;flex:none;display:grid;place-items:center;font-family:"Caveat";font-size:34px;color:#c0463a}
.tabs{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:flex-end;padding:0 26px;gap:8px}
.tabs div{padding:12px 22px 14px;border-radius:14px 14px 0 0;background:#e4d9c0;font:700 14px system-ui;color:#6b6552}.tabs div.on{background:#2b2a45;color:#f6efe0;padding-bottom:20px}
.page{padding:20px 26px}.big{font-family:"Caveat";font-size:92px;color:#2b2a45;line-height:1;transform:rotate(-3deg);margin-top:20px}
.stamp{display:inline-block;border:3px solid #c0463a;color:#c0463a;border-radius:10px;padding:4px 12px;font:800 15px system-ui;transform:rotate(6deg);letter-spacing:.08em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px;text-align:center;font:600 12px system-ui;color:#6b6552}
.cal i{display:grid;place-items:center;width:34px;height:34px;margin:auto;font-style:normal;border-radius:50%}.cal i.d{border:2.5px solid #c0463a;color:#c0463a}.cal i.n{border:1.5px dashed #b9ae95}
.act{position:absolute;left:26px;right:26px;bottom:90px;display:flex;gap:10px}.act div{flex:1;text-align:center;padding:14px 0;border:2.5px solid #2b2a45;border-radius:14px;font:800 16px system-ui}.act .p{background:#2b2a45;color:#f6efe0}
</style></head><body><div class="row">
<figure><div class="ph"><div class="st"><span>9:41</span><span>94%</span></div><div class="hd"><h2>Сьогодні</h2><span>20 листопада</span></div>
<div class="cards">
<div class="tk"><div class="th" style="background:#cfe7ef">💧</div><div class="tx"><b>Вода</b><span>1,25 з 2 літрів</span></div><div class="mk">●●○</div></div>
<div class="tk"><div class="th" style="background:#d9e8c8">💊</div><div class="tx"><b>Вітаміни</b><span>після їжі · 08:30</span></div><div class="mk">✓</div></div>
<div class="tk"><div class="th" style="background:#f6dcc0">📖</div><div class="tx"><b>Читання</b><span>18 з 30 хвилин</span></div><div class="mk">●○</div></div>
<div class="tk"><div class="th" style="background:#f1cfd0">🏋️</div><div class="tx"><b>Підтягування</b><span>1 з 3 підходів</span></div><div class="mk">◐</div></div>
<div class="tk"><div class="th" style="background:#dcd3f0">🌙</div><div class="tx"><b>Вечір</b><span>увечері</span></div><div class="mk" style="color:#b9ae95">○</div></div>
</div><div class="tabs"><div class="on">Сьогодні</div><div>Місяць</div><div>Звички</div></div></div>
<figcaption><b>Журнал · Сьогодні</b>Звички як квитки у щоденнику: мініатюра, назва, чорнильна позначка. Жодних кнопок на сторінці. Док це закладки-вкладки, як у блокноті.</figcaption></figure>

<figure><div class="ph"><div class="st"><span>9:41</span><span>94%</span></div><div class="page"><div style="font-size:15px;color:#6b6552;font-family:system-ui">‹ Сьогодні</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><h2 style="margin:0;font-size:32px">Читання</h2><div class="stamp">27 З 30</div></div>
<div class="big">18 <span style="font-size:36px">/ 30 хв</span></div>
<div class="cal"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span><i class="d">1</i><i class="d">2</i><i class="d">3</i><i class="n">4</i><i class="d">5</i><i class="d">6</i><i class="d">7</i><i class="d">8</i><i class="d">9</i><i class="d">10</i><i class="d">11</i><i class="n">12</i><i class="d">13</i><i class="d">14</i></div></div>
<div class="act"><div>+10 хв</div><div class="p">▶ Таймер</div></div>
<div class="tabs"><div>Сьогодні</div><div class="on">Місяць</div><div>Звички</div></div></div>
<figcaption><b>Журнал · Сторінка звички</b>Календар обведений чорнилом, пропуск штриховий, а не «зламаний ланцюжок». Дії на самому дні сторінки, а не розкидані по екрану.</figcaption></figure>
</div></body></html>
