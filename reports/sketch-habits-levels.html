<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Звички: Рівні</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#d7e3e6;font-family:"DM Sans",system-ui,sans-serif;padding:24px;color:#10333a}
.row{display:flex;gap:26px}figure{margin:0;width:475px}figcaption{font-size:13.5px;color:#46676e;margin-top:10px;line-height:1.4}figcaption b{display:block;color:#10333a;font-size:15px}
.ph{position:relative;width:475px;height:751px;border-radius:38px;overflow:hidden;background:#eaf3f1}
.st{padding:16px 28px 0;font-size:12px;display:flex;justify-content:space-between;font-weight:700}
.hd{padding:8px 24px 0}.hd h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}.hd span{color:#5a7e85;font-weight:700;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0}
.tile{position:relative;height:168px;border-radius:36px;overflow:hidden;background:#fff}
.tile .fill{position:absolute;left:-10%;right:-10%;bottom:0;border-radius:50% 50% 0 0/22px 22px 0 0}
.tile .in{position:absolute;inset:0;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between}
.tile .g{font-size:30px}.tile b{font-size:17px;font-weight:800;display:block}.tile span{font-size:13px;font-weight:700;opacity:.7}
.pill{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);height:60px;width:360px;border-radius:30px;background:rgba(16,51,58,.92);display:flex;align-items:center;justify-content:space-around;color:#9fc1c6;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(16,51,58,.35)}
.pill i{font-style:normal;padding:10px 18px;border-radius:22px}.pill i.on{background:#eaf3f1;color:#10333a}
.full{position:absolute;inset:0}
.full .fill{position:absolute;left:-10%;right:-10%;bottom:0;background:#9bd3f0;border-radius:50% 50% 0 0/46px 46px 0 0}
.full .in{position:absolute;inset:0;padding:60px 28px 0}
.num{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:46px}.num small{font-size:26px;letter-spacing:0}
.chips{display:flex;gap:10px;position:absolute;left:24px;right:24px;bottom:100px}.chips div{flex:1;text-align:center;padding:16px 0;border-radius:24px;background:rgba(255,255,255,.9);font-weight:800;font-size:17px}.chips .p{background:#10333a;color:#fff}
.mini{display:flex;gap:8px;margin-top:22px}.mini i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);display:block}.mini i.a{background:#10333a}
</style></head><body><div class="row">
<figure><div class="ph"><div class="st"><span>9:41</span><span>94%</span></div><div class="hd"><span>пʼятниця, 20 листопада</span><h2>Сьогодні</h2></div>
<div class="tiles">
<div class="tile"><div class="fill" style="height:62%;background:#9bd3f0"></div><div class="in"><div class="g">💧</div><div><b>Вода</b><span>1,25 з 2 л</span></div></div></div>
<div class="tile" style="background:#f2f7ee"><div class="fill" style="height:100%;background:#b8e0a0"></div><div class="in"><div class="g">💊</div><div><b>Вітаміни</b><span>прийнято ✓</span></div></div></div>
<div class="tile"><div class="fill" style="height:60%;background:#ffd29a"></div><div class="in"><div class="g">📖</div><div><b>Читання</b><span>18 з 30 хв</span></div></div></div>
<div class="tile"><div class="fill" style="height:33%;background:#f6b5b0"></div><div class="in"><div class="g">🏋️</div><div><b>Підтягування</b><span>1 з 3 підходів</span></div></div></div>
<div class="tile"><div class="fill" style="height:0;background:#cdbdf2"></div><div class="in"><div class="g">🌙</div><div><b>Вечір</b><span>увечері</span></div></div></div>
<div class="tile"><div class="fill" style="height:70%;background:#bfe8e0"></div><div class="in"><div class="g">🚶</div><div><b>Ходьба</b><span>5 200 кроків</span></div></div></div>
</div>
<div class="pill"><i class="on">Сьогодні</i><i>Історія</i><i>Ще</i></div></div>
<figcaption><b>Рівні · Сьогодні</b>Кожна картка це «склянка»: чим більше зроблено, тим вище рівень рідини. Жодних кнопок: видно прогрес із першого погляду. Док це довга таблетка з текстовими вкладками.</figcaption></figure>

<figure><div class="ph"><div class="full" style="background:#e9f4f6"><div class="fill" style="height:62%"></div>
<div class="in"><div style="display:flex;justify-content:space-between;font-weight:800"><span style="font-size:15px">‹ Назад</span><span style="color:#46676e">ціль 2 л</span></div>
<div style="font-size:30px;margin-top:28px">💧</div><div style="font-size:22px;font-weight:800">Вода</div>
<div class="num">1,25<small> л</small></div><div style="font-weight:700;opacity:.65;margin-top:8px">ще 0,75 л до цілі · серія 5 днів</div>
<div class="mini"><i class="a"></i><i class="a"></i><i class="a"></i><i class="a"></i><i class="a"></i><i></i><i></i></div></div>
<div class="chips"><div>+0,25</div><div class="p">+0,5 л</div><div>↶</div></div></div></div>
<figcaption><b>Рівні · Відкрита картка</b>Картка розгортається на весь екран, рівень рідини лишається тлом. Дії лише тут, трьома великими плитками, під пальцем.</figcaption></figure>
</div></body></html>
