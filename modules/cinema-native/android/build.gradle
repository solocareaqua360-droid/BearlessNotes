plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bearlessnotes'
version = '1.0.0'

android {
  namespace "expo.modules.cinemanative"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // addDocumentStartJavaScript: a script into the player's YouTube iframe.
  implementation "androidx.webkit:webkit:1.12.1"
}
